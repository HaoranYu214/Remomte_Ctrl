[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keithley4200-measurement"
version = "0.1.0"
description = "Keithley 4200A-SCS PMU and SMU measurement library"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "pyvisa",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

